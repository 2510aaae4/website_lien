<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="site-head">
  <div class="wrap head-row">
    <a class="brand" href="index.html">
      <span class="mark"><svg viewBox="0 0 24 24"><path d="M2 13h4l1.5-4 3 8L13 9l1.5 4H22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span><b>連思涵 醫師</b><small>CARDIOLOGY · 心臟專科</small></span>
    </a>
    <nav class="nav">
      <a href="index.html">首頁</a>
      <a href="articles.html">衛教文章</a>
      <a href="index.html#about">關於醫師</a>
      <a class="btn btn-primary" href="articles.html">完成 / 返回列表</a>
    </nav>
    <button class="nav-toggle" aria-label="選單">☰</button>
  </div>
</header>

<section class="page-band wrap">
  <span class="kicker">新增文章</span>
  <h1>寫一篇<span class="em"> 新的衛教文章</span></h1>
  <p>支援三種內容：<b>文字段落</b>、<b>圖片</b>（上傳）、<b>影片</b>（YouTube 連結或上傳檔案）。本示範儲存在你的瀏覽器，正式上線後將改存到雲端後台（見專案說明）。</p>
</section>

<section class="section wrap" style="padding-top:24px">
  <form class="editor" id="editor-form">
    <div class="field">
      <label for="f-title">文章標題</label>
      <input type="text" id="f-title" placeholder="例：高血壓，為什麼叫沉默殺手？" required>
    </div>
    <div class="field">
      <label for="f-cat">分類</label>
      <select id="f-cat">
        <option>三高與預防</option>
        <option>健康老化</option>
        <option>女性健康</option>
        <option>心臟疾病</option>
        <option>其他</option>
      </select>
    </div>
    <div class="field">
      <label for="f-excerpt">摘要（顯示在卡片上）</label>
      <textarea id="f-excerpt" placeholder="用一兩句話，說明這篇文章在講什麼。"></textarea>
    </div>

    <div class="field">
      <label>內容區塊</label>
      <div class="blocks" id="blocks"></div>
      <div class="add-row">
        <button type="button" class="btn btn-ghost" id="add-text">＋ 文字段落</button>
        <button type="button" class="btn btn-ghost" id="add-img">＋ 圖片</button>
        <button type="button" class="btn btn-ghost" id="add-video">＋ 影片</button>
      </div>
      <p class="hint">區塊會依新增順序，由上到下顯示在文章中。</p>
    </div>

    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:16px">儲存並發佈文章</button>
  </form>
</section>

<footer class="foot">
  <div class="wrap foot-bottom" style="border:none">
    <span>© 2026 連思涵醫師</span>
    <a class="read" href="articles.html">← 全部文章</a>
  </div>
</footer>

<script src="assets/js/store.js"></script>
<script src="assets/js/main.js"></script>
<script>initEditor();</script>
</body>
</html>
