<body>
<header class="site-head">
  <div class="wrap head-row">
    <a class="brand" href="index.html">
      <span class="mark"><svg viewBox="0 0 24 24"><path d="M2 13h4l1.5-4 3 8L13 9l1.5 4H22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>

    <nav class="nav">
      <a href="index.html">首頁</a>

      <a href="index.html#about">關於醫師</a>

<section class="page-band wrap">
  <span class="kicker reveal">衛教文章</span>
  <h1 class="reveal d1">讀懂身體的<span class="em"> 每一張報告</span></h1>
  <p class="reveal d2">每篇文章都支援文字、圖片與影片。想自己新增一篇？點右上角「✎ 寫文章」。</p>
  <div class="filters reveal d3" id="filters"></div>
</section>

<section class="section wrap" style="padding-top:30px">
  <div class="cards" id="all-cards"></div>
</section>

<footer class="foot">
  <div class="wrap foot-bottom" style="border:none">
    <span>© 2026 連思涵醫師. 衛教內容僅供參考，不能取代專業診斷。</span>
    <a class="read" href="index.html">← 回首頁</a>
  </div>
</footer>

<script src="assets/js/store.js"></script>
<script src="assets/js/main.js"></script>
<script>
  let current="全部";
  const cats=["全部",...Store.categories()];
  const fbox=document.querySelector("#filters");
  function paint(){
    const list = current==="全部" ? Store.all() : Store.all().filter(a=>a.category===current);
    renderCards("#all-cards", list);
    fbox.querySelectorAll(".pill").forEach(p=>p.classList.toggle("active",p.dataset.c===current));
  }
  fbox.innerHTML = cats.map(c=>`<button class="pill" data-c="${c}">${c}</button>`).join("");
  fbox.querySelectorAll(".pill").forEach(p=>p.onclick=()=>{current=p.dataset.c;paint();});
  paint();
</script>
</body>
</html>
